services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: expensetracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: expensetracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: replace_this_with_a_long_random_secret_key
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3001
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      REACT_APP_API_URL: http://localhost:5001/api
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
